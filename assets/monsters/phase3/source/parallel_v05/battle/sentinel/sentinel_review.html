se, "frame": 1}, {"bounds": [65, 61, 126, 170], "edge_touch": false, "frame": 2}, {"bounds": [68, 62, 121, 169], "edge_touch": false, "frame": 3}], "pose_holds": {}}}, "anchor": [128.0, 224.0], "size": [256.0, 256.0], "source": "res://assets/monsters/phase3/source/parallel_v05/battle/sentinel/sentinel_rig.json", "status": "draft", "entity": "sentinel", "view": "battle_left", "master_size": [512, 512], "human_signoff": false},action=document.querySelector('#action'),slider=document.querySelector('#scrub');for(const id in data.actions)action.add(new Option(id,id));let t=0,playing=true,last=performance.now();function draw(){const a=data.actions[action.value];let f=Math.floor(t*a.fps+.00001);f=a.loop?f%a.frames.length:Math.min(f,a.frames.length-1);document.querySelectorAll('img').forEach(im=>im.src=(document.querySelector('#fx').checked&&a.combined_frames?a.combined_frames:a.frames)[f]);slider.max=a.frames.length-1;slider.value=f;document.querySelector('#frame').textContent=`${action.value} ${f+1}/${a.frames.length} · ${a.fps} FPS · ${JSON.stringify(a.events)}`;}action.onchange=()=>{t=0;draw()};document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'暂停':'播放'};document.querySelector('#restart').onclick=()=>{t=0;playing=true;draw()};document.querySelector('#next').onclick=()=>{playing=false;t=((Number(slider.value)+1)%data.actions[action.value].frames.length)/data.actions[action.value].fps;draw()};slider.oninput=()=>{playing=false;t=Number(slider.value)/data.actions[action.value].fps;draw()};document.querySelector('#fx').onchange=draw;function tick(now){if(playing)t+=(now-last)/1000*Number(document.querySelector('#speed').value);last=now;draw();requestAnimationFrame(tick)}draw();requestAnimationFrame(tick)</script></html>
