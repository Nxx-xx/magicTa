<!doctype html><meta charset='utf-8'><title>Draft rig review</title><style>body{background:#17212c;color:#eee;font:16px sans-serif}section{display:inline-block;vertical-align:top;width:400px}img{background:repeating-conic-gradient(#37404a 0% 25%,#26303a 0% 50%) 0/20px 20px}button{padding:12px}strong{color:#ffba80}</style><h1>DRAFT — 分层绑定审查，未接入游戏</h1><p>原速/0.25速/暂停/逐帧；这里只证明源可编辑，不代表动作验收。</p><button onclick='speed=1'>原速</button><button onclick='speed=.25'>慢速</button><button onclick='paused=!paused'>暂停</button><button onclick='paused=true;step++'>逐帧</button><section><h2>knight_map / idle <strong>draft</strong></h2><img id='idle' width='384'><p>格子：<img id='idle_47' width='47'><img id='idle_33' width='33'><img id='idle_26' width='26'></p></section><script>let data={"idle":{"fps":6.0,"frames":["knight_map_frames/idle/00.png","knight_map_frames/idle/01.png","knight_map_frames/idle/02.png","knight_map_frames/idle/03.png"]}},speed=1,paused=false,step=0,t=0,last=performance.now();function loop(now){if(!paused)t+=(now-last)/1000*speed;last=now;for(let [id,a] of Object.entries(data)){let i=(Math.floor(t*a.fps)+step)%a.frames.length;for(let suffix of ['', '_47','_33','_26'])document.getElementById(id+suffix).src=a.frames[i]}requestAnimationFrame(loop)}requestAnimationFrame(loop)</script>
